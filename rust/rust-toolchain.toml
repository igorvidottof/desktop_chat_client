[toolchain]
# Fixa a versão Rust para builds desktop reproduzíveis.
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
